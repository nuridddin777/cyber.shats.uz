{% extends "app_base.html" %}
{% block title %}Sinf yaratish — EDU{% endblock %}
{% block app_content %}
<div style="max-width:500px;margin:0 auto;">
  <h2 style="color:#e8f4ff;font-size:20px;margin-bottom:20px;">📚 Yangi sinf yaratish</h2>
  <form method="post" action="{{ url_for('edu.teacher_create_class') }}">
    <div style="margin-bottom:14px;">
      <label style="font-size:12px;color:#7ec8f8;display:block;margin-bottom:6px;">Sinf nomi *</label>
      <input type="text" name="name" placeholder="Masalan: 9-A sinf Informatika" required style="width:100%;background:rgba(5,15,30,0.9);border:1px solid rgba(30,144,255,0.2);border-radius:8px;color:#e8f4ff;padding:11px 14px;font-size:14px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:12px;color:#7ec8f8;display:block;margin-bottom:6px;">Fan</label>
      <input type="text" name="subject" placeholder="Informatika, Dasturlash..." style="width:100%;background:rgba(5,15,30,0.9);border:1px solid rgba(30,144,255,0.2);border-radius:8px;color:#e8f4ff;padding:11px 14px;font-size:14px;box-sizing:border-box;">
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:12px;color:#7ec8f8;display:block;margin-bottom:6px;">Viloyat</label>
      <select id="regSel" onchange="loadDist(this.value)" style="width:100%;background:rgba(5,15,30,0.9);border:1px solid rgba(30,144,255,0.2);border-radius:8px;color:#e8f4ff;padding:11px 14px;font-size:14px;">
        <option value="">-- Tanlang --</option>
        {% for r in regions %}<option value="{{ r.id }}">{{ r.name }}</option>{% endfor %}
      </select>
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:12px;color:#7ec8f8;display:block;margin-bottom:6px;">Tuman</label>
      <select id="distSel" onchange="loadSchools(this.value)" style="width:100%;background:rgba(5,15,30,0.9);border:1px solid rgba(30,144,255,0.2);border-radius:8px;color:#e8f4ff;padding:11px 14px;font-size:14px;">
        <option value="">-- Avval viloyat tanlang --</option>
      </select>
    </div>
    <div style="margin-bottom:20px;">
      <label style="font-size:12px;color:#7ec8f8;display:block;margin-bottom:6px;">Maktab *</label>
      <select name="school_id" id="schoolSel" required style="width:100%;background:rgba(5,15,30,0.9);border:1px solid rgba(30,144,255,0.2);border-radius:8px;color:#e8f4ff;padding:11px 14px;font-size:14px;">
        <option value="">-- Avval tuman tanlang --</option>
      </select>
    </div>
    <button type="submit" class="cs-btn" style="width:100%;padding:14px;font-size:15px;">📚 Sinf yaratish</button>
  </form>
</div>
<script>
function loadDist(rid){
  if(!rid)return;
  fetch(`/edu/api/districts?region_id=${rid}`).then(r=>r.json()).then(d=>{
    const s=document.getElementById('distSel');
    s.innerHTML='<option value="">-- Tanlang --</option>';
    (d.districts||[]).forEach(x=>s.innerHTML+=`<option value="${x.id}">${x.name}</option>`);
  });
}
function loadSchools(did){
  if(!did)return;
  fetch(`/edu/api/schools?district_id=${did}`).then(r=>r.json()).then(d=>{
    const s=document.getElementById('schoolSel');
    s.innerHTML='<option value="">-- Tanlang --</option>';
    (d.schools||[]).forEach(x=>s.innerHTML+=`<option value="${x.id}">${x.name}</option>`);
  });
}
</script>
{% endblock %}
